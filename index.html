<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XQ XS AI生成器（Demo）</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e60012'/%3E%3Cpath d='M16 6l2.4 6.6L25 15l-6.6 2.4L16 24l-2.4-6.6L7 15l6.6-2.4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════
   展示版：單一檔案、離線可開，不連任何外部資源。
   視覺沿用 xsgen/static/index.html 的設計權杖。
   ══════════════════════════════════════════════════════════ */
:root{
  --brand:#e60012; --brand-dark:#b8000f; --brand-soft:#fdecee; --brand-line:#f6c8cc;
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#f9fafb; --line:#e3e6ea; --line-soft:#eff1f4;
  --text:#171b21; --text-2:#525a65; --text-3:#858e9a;
  --code-bg:#1a1e26; --code-head:#20252e; --code-line:#2b313c; --code-text:#e2e7ef;
  --code-kw:#d0a3f5; --code-fn:#8ab4ff; --code-str:#c9e89a; --code-num:#ffab7d;
  --code-cmt:#7d889b; --code-meta:#f2c46d; --code-gutter:#5c6675;
  --ok:#12915a; --ok-soft:#e5f5ed; --ok-line:#b9e3cc;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --c-filter:#2563eb; --c-ind:#7c3aed; --c-sensor:#d97706; --c-trade:#e60012;
  --c-chat:#0d9488; --c-inject:#be123c; --err-text:#b8000f;
  --header-h:76px; --me-bg:#c5cad2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#ff4b57; --brand-dark:#e60012; --brand-soft:#3d1a1e; --brand-line:#63272d;
    --bg:#111419; --panel:#191d24; --panel-2:#1f242c; --line:#2d333d; --line-soft:#252a33;
    --text:#eaedf1; --text-2:#aab3be; --text-3:#7d8794;
    --code-bg:#0f1218; --code-head:#151920; --code-line:#242a35;
    --ok:#3ccf8e; --ok-soft:#14291f; --ok-line:#22513a;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55);
    --c-filter:#6b9bff; --c-ind:#a98bff; --c-sensor:#f0a640; --c-trade:#ff5c67; --me-bg:#39414d;
    --c-chat:#2dd4bf; --c-inject:#fb7185; --err-text:#ff9ba2;
  }
}
:root[data-theme="dark"]{
  --brand:#ff4b57; --brand-dark:#e60012; --brand-soft:#3d1a1e; --brand-line:#63272d;
  --bg:#111419; --panel:#191d24; --panel-2:#1f242c; --line:#2d333d; --line-soft:#252a33;
  --text:#eaedf1; --text-2:#aab3be; --text-3:#7d8794;
  --code-bg:#0f1218; --code-head:#151920; --code-line:#242a35;
  --ok:#3ccf8e; --ok-soft:#14291f; --ok-line:#22513a;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --c-filter:#6b9bff; --c-ind:#a98bff; --c-sensor:#f0a640; --c-trade:#ff5c67; --me-bg:#39414d;
    --c-chat:#2dd4bf; --c-inject:#fb7185; --err-text:#ff9ba2;
}

*{box-sizing:border-box;}
html,body{height:100%;}
/* body 刻意不加 transition：Chromium 切換主題時不會重新解析 var()，顏色會卡住 */
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",
       -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.012em; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh;
}
button,textarea{font-family:inherit;letter-spacing:inherit;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ── 頂列 ─────────────────────────────────────────────── */
header{
  height:var(--header-h); flex:0 0 auto;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  padding:0 24px; padding-top:env(safe-area-inset-top);
  background:var(--panel); border-bottom:1px solid var(--line);
}
.title{grid-column:2;text-align:center;min-width:0;}
.title h1{margin:0;font-size:27px;font-weight:800;letter-spacing:.02em;line-height:1.2;white-space:nowrap;}
.title h1 em{font-style:normal;color:var(--brand);}
.title p{margin:3px 0 0;font-size:13.5px;color:var(--text-3);letter-spacing:.03em;white-space:nowrap;}
.head-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:6px;}
/* 標題旁的 DEMO 標示：讓觀眾一眼知道這是展示用版本 */
.demo-tag{
  display:inline-block;vertical-align:middle;position:relative;top:-2px;margin-left:10px;
  font-size:12.5px;font-weight:800;letter-spacing:.12em;line-height:1.6;
  color:#fff;background:var(--brand);padding:1px 9px;border-radius:6px;
}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
  color:var(--text-2);font-size:14.5px;padding:9px 12px;border-radius:10px;white-space:nowrap;
}
.hbtn:hover{background:var(--line-soft);color:var(--text);}
.hbtn:focus-visible,.card:focus-visible,.mini:focus-visible,.sendbtn:focus-visible,.copy:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;}
.hbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

/* ── 主區 ─────────────────────────────────────────────── */
.main-col{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:18px 20px 16px;}
.board{
  flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
}
#scroll{flex:1 1 auto;overflow-y:auto;padding:32px 36px 12px;min-height:0;scroll-behavior:smooth;}
.thread{max-width:960px;margin:0 auto;}

/* ── 空狀態：四張策略卡 ───────────────────────────────── */
.empty{max-width:880px;margin:16px auto 8px;text-align:center;animation:fadeUp .45s ease both;}
/* 中性的 AI 圖示（不使用任何公司標誌） */
.badge{
  width:74px;height:74px;border-radius:22px;color:#fff;
  background:linear-gradient(135deg, var(--brand), var(--brand-dark));
  display:grid;place-items:center;margin:0 auto 20px;box-shadow:var(--shadow);
}
.badge svg{width:40px;height:40px;fill:currentColor;display:block;}
.empty h2{margin:0 0 8px;font-size:25px;font-weight:800;letter-spacing:.02em;line-height:1.4;}
.empty>p{margin:0 0 30px;color:var(--text-3);font-size:15.5px;line-height:1.8;text-wrap:balance;}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left;}
.card{
  --c:var(--brand);
  display:flex;gap:15px;align-items:flex-start;width:100%;text-align:left;
  background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
  padding:18px;cursor:pointer;color:inherit;font:inherit;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.card:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow);}
.card .ico{
  flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb, var(--c) 13%, transparent);color:var(--c);
}
.card .ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.card .txt{min-width:0;flex:1 1 auto;}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.tag{
  font-size:12px;font-weight:700;letter-spacing:.06em;padding:1px 9px;border-radius:999px;line-height:1.8;
  color:var(--c);background:color-mix(in srgb, var(--c) 11%, transparent);
}
.tag.freq{color:var(--text-2);background:var(--line-soft);font-weight:600;}
.card b{display:block;font-size:16px;font-weight:700;line-height:1.5;margin-bottom:3px;}
.card .d{display:block;font-size:13.5px;color:var(--text-3);line-height:1.7;}
.card .go{flex:0 0 auto;align-self:center;color:var(--text-3);transition:color .15s,transform .15s;}
.card:hover .go{color:var(--c);transform:translateX(3px);}
.card .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.t-filter{--c:var(--c-filter);} .t-ind{--c:var(--c-ind);} .t-sensor{--c:var(--c-sensor);} .t-trade{--c:var(--c-trade);}
.t-chat{--c:var(--c-chat);} .t-inject{--c:var(--c-inject);}
/* 防護機制展示區 */
.sec{margin:30px 0 12px;text-align:left;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;}
.sec h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:.04em;display:inline-flex;align-items:center;gap:7px;}
.sec h3 svg{width:19px;height:19px;stroke:var(--ok);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;align-self:center;}
.sec span{font-size:13.5px;color:var(--text-3);}
.cards.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.cards.g3 .card{padding:16px;gap:13px;}
.cards.g3 .card .ico{width:40px;height:40px;}
body.busy .card,body.busy .mini{pointer-events:none;opacity:.5;}

/* ── 訊息 ─────────────────────────────────────────────── */
.msg{display:flex;gap:14px;margin-bottom:30px;align-items:flex-start;animation:fadeUp .35s ease both;}
.msg.user{flex-direction:row-reverse;}
.pic{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;}
.pic.bot{background:linear-gradient(135deg, var(--brand), var(--brand-dark));color:#fff;}
.pic.bot svg{width:22px;height:22px;fill:currentColor;display:block;}
.pic.me{background:var(--me-bg);}
.pic.me svg{width:21px;height:21px;fill:#fff;}
.col{min-width:0;max-width:calc(100% - 54px);display:flex;flex-direction:column;flex:0 1 auto;}
.msg.bot .col{flex:1 1 auto;}
.msg.user .col{align-items:flex-end;}
.ts{font-size:12.5px;color:var(--text-3);margin-bottom:7px;padding:0 4px;letter-spacing:.04em;}
.bubble{
  background:var(--panel-2);border:1px solid var(--line);border-radius:16px;
  padding:16px 20px;min-width:0;overflow-wrap:anywhere;font-size:15.5px;line-height:1.85;
}
.msg.user .bubble{background:var(--brand-soft);border-color:var(--brand-line);white-space:pre-wrap;}
.bubble.bare{background:transparent;border:0;padding:0;}
/* 被安全審查攔下時的紅框（與正式版相同的呈現） */
.notice{border-radius:12px;padding:13px 17px;font-size:15px;line-height:1.8;animation:fadeUp .3s ease both;}
.notice.err{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--err-text);}
/* 展示給觀眾看的旁白：虛線框，與系統真正的回覆區隔開 */
.demo-note{
  margin-top:10px;border:1.5px dashed var(--line);border-radius:12px;padding:11px 15px;
  font-size:13.5px;line-height:1.85;color:var(--text-2);background:var(--panel);animation:fadeUp .4s ease .12s both;
}
.demo-note b{color:var(--text);}
.demo-note .tagd{
  display:inline-block;margin-right:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;line-height:1.7;
  color:#fff;background:var(--text-3);padding:0 8px;border-radius:5px;vertical-align:1px;
}

/* ── 產生中的階段動畫 ─────────────────────────────────── */
.progress{display:flex;align-items:center;gap:8px;color:var(--text);font-size:15.5px;font-weight:600;}
.progress .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:bounce 1.15s infinite ease-in-out;}
.progress .dot:nth-child(2){animation-delay:.16s;}
.progress .dot:nth-child(3){animation-delay:.32s;}
.progress .stage{margin-left:6px;white-space:nowrap;}
/* 「···」是全形字：固定寬度的 inline-block 一定要 nowrap，否則三個點會各自折行、往上疊成一直排 */
.progress .stage::after{content:"";display:inline-block;width:2.4em;white-space:nowrap;text-align:left;animation:dots 1.4s steps(4,end) infinite;}
.detail{margin:4px 0 0 35px;font-size:13.5px;color:var(--text-3);line-height:1.7;min-height:1.7em;}
.detail.swap{animation:fadeIn .3s ease both;}
/* 步驟條：圓點在上、文字在下的四等分格線，任何寬度都不會折行 */
.steps{list-style:none;margin:16px 0 2px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:460px;}
.steps li{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:13px;color:var(--text-3);text-align:center;white-space:nowrap;transition:color .2s;
}
.steps li::before{
  content:"";position:absolute;top:10px;left:calc(-50% + 15px);right:calc(50% + 15px);
  height:2px;border-radius:2px;background:var(--line);transition:background .3s;
}
.steps li:first-child::before{display:none;}
.steps li.done::before,.steps li.on::before{background:var(--ok);}
.steps li .n{
  position:relative;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;border:1.5px solid var(--line);color:var(--text-3);background:var(--panel);
}
.steps li .n svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.steps li.on{color:var(--brand);font-weight:700;}
.steps li.on .n{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);animation:pulse 1.4s ease-in-out infinite;}
.steps li.done{color:var(--ok);}
.steps li.done .n{border-color:var(--ok);background:var(--ok);color:#fff;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-6px);opacity:1;}}
@keyframes dots{0%{content:"";}25%{content:"·";}50%{content:"··";}75%{content:"···";}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 35%, transparent);}50%{box-shadow:0 0 0 5px transparent;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:none;}}

/* ── 程式碼卡（行號＋複製）────────────────────────────── */
.codewrap{
  border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);
  animation:fadeUp .4s ease both;box-shadow:var(--shadow);
}
.code-head{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px 10px 16px;
  background:var(--code-head);border-bottom:1px solid var(--code-line);
}
.code-head .lang{font:700 12px/1 Consolas,"Cascadia Mono",monospace;color:#9aa4b4;letter-spacing:.1em;}
.code-head .tbadge{
  font-size:12px;font-weight:700;color:#fff;padding:2px 10px;border-radius:999px;line-height:1.7;
  background:color-mix(in srgb, var(--c) 78%, #000);
}
.code-head .okbadge{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1.7;
  color:#7fe0ae;background:rgba(18,145,90,.18);border:1px solid rgba(60,207,142,.28);padding:1px 9px;border-radius:999px;
}
.code-head .okbadge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.code-head .lines{font-size:12px;color:#7d889b;}
.copy{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.09);color:#eaeef4;border:1px solid rgba(255,255,255,.16);border-radius:9px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:background .12s;
}
.copy:hover{background:rgba(255,255,255,.18);}
.copy.done{background:rgba(18,145,90,.92);border-color:transparent;color:#fff;}
.copy svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.codewrap pre{
  margin:0;padding:16px 18px 18px 0;overflow-x:auto;
  font-family:"JetBrains Mono",Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
  font-size:14px;line-height:1.85;color:var(--code-text);counter-reset:ln;letter-spacing:0;tab-size:4;
}
.codewrap .ln{display:block;padding-left:60px;position:relative;white-space:pre;animation:lnIn .3s ease both;}
.codewrap .ln::before{
  counter-increment:ln;content:counter(ln);position:absolute;left:0;width:42px;text-align:right;
  color:var(--code-gutter);font-variant-numeric:tabular-nums;user-select:none;
}
.codewrap .ln:hover{background:rgba(255,255,255,.04);}
.kw{color:var(--code-kw);} .fn{color:var(--code-fn);} .str{color:var(--code-str);}
.num{color:var(--code-num);} .cmt{color:var(--code-cmt);font-style:italic;} .meta{color:var(--code-meta);}

.generated-disclaimer{margin:12px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text-2);font-size:13px;line-height:1.75;}
.generated-disclaimer strong{font-weight:700;color:var(--text);}
.after{margin-top:16px;animation:fadeUp .4s ease .25s both;}
.after .lbl{font-size:13px;color:var(--text-3);margin:0 0 8px 2px;letter-spacing:.04em;}
.after .grp+.grp{margin-top:12px;}
.minis{display:flex;flex-wrap:wrap;gap:8px;}
.mini{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;   /* --c 由 .t-* 類別提供，這裡不可再設預設值，否則會蓋掉 */
  background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--text-2);
  padding:6px 14px 6px 10px;font-size:14px;transition:border-color .12s,color .12s;
}
.mini:hover{border-color:var(--c);color:var(--c);}
.mini i{width:8px;height:8px;border-radius:50%;background:var(--c);}

/* ── 輸入列 ───────────────────────────────────────────── */
.composer{flex:0 0 auto;padding:12px 36px 0;}
.composer-inner{max-width:960px;margin:0 auto;}
.inputbox{
  display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:15px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;
}
.inputbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent);}
.inputbox textarea{
  flex:1 1 auto;min-width:0;border:0;outline:0;resize:none;background:transparent;color:var(--text);
  font-size:16px;line-height:1.7;max-height:180px;min-height:30px;padding:6px 0;display:block;
}
.inputbox textarea::placeholder{color:var(--text-3);}
.sendbtn{
  width:44px;height:44px;border-radius:12px;border:0;background:var(--brand);color:#fff;cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto;transition:background .12s;
}
.sendbtn:hover{background:var(--brand-dark);}
.sendbtn:disabled{background:var(--line);color:var(--text-3);cursor:not-allowed;}
.sendbtn svg{width:20px;height:20px;}
.disclaimer{
  max-width:960px;margin:10px auto 0;padding:0 6px 12px;font-size:12.5px;line-height:1.7;
  color:var(--text-3);text-align:center;
}

/* ── RWD ──────────────────────────────────────────────── */
@media (max-width:1100px){ .title p{display:none;} .title h1{font-size:24px;} }
@media (max-width:860px){
  :root{--header-h:64px;}
  header{grid-template-columns:minmax(0,1fr) auto;padding:0 12px 0 16px;gap:10px;}
  .title{grid-column:1;text-align:left;}
  .title h1{font-size:20px;}
  .head-right{grid-column:2;gap:2px;}
  .hbtn span,.demo-tag .long{display:none;}
  .hbtn{padding:9px;}
  .main-col{padding:10px;}
  #scroll{padding:22px 16px 8px;}
  .composer{padding:10px 12px 0;}
  .empty{margin-top:8px;}
  .cards.g3{grid-template-columns:minmax(0,1fr);gap:10px;}
  .sec{margin-top:24px;}
  .empty h2{font-size:21px;}
  .empty>p{font-size:14.5px;margin-bottom:22px;}

const CODES = ["{@type:filter}\n// 選股：5 日均線黃金交叉 20 日均線，且 MACD 柱狀體(OSC)由綠翻紅\n// 採用：MACD 參數 12／26／9，以 WeightedClose 計算（與 XQ 內建 MACD 指標一致）\n// 採用：「翻紅」解讀為 OSC 由負轉正，也就是向上穿越 0 軸\ninput: _FastLen(5, \"短期均線\");\ninput: _SlowLen(20, \"長期均線\");\ninput: _MACDFast(12, \"MACD 快線\");\ninput: _MACDSlow(26, \"MACD 慢線\");\ninput: _MACDSig(9, \"MACD 訊號線\");\n\nvariable: _ma1(0), _ma2(0);\nvariable: _dif(0), _macd(0), _osc(0);\n\n// 選股預設只載入少量歷史 K 棒，MACD 需要足夠的暖身資料\nSetTotalBar(_MACDSlow * 3 + _MACDSig);\n\n_ma1 = Average(Close, _FastLen);\n_ma2 = Average(Close, _SlowLen);\nMACD(WeightedClose(), _MACDFast, _MACDSlow, _MACDSig, _dif, _macd, _osc);\n\n// 兩個條件必須在同一根 K 棒同時成立\nif _ma1 Crosses Above _ma2 and _osc Crosses Above 0 then ret = 1;\n\nOutputField(1, _ma1, 2, \"5日均線\");\nOutputField(2, _ma2, 2, \"20日均線\");\nOutputField(3, _osc, 2, \"MACD OSC\");\n", "{@type:indicator}\n// 指標：RSI 相對強弱指標，附 RSI 平均線與 70／30 超買超賣參考線\n// 採用：RSI 以收盤價計算，期數 14；平均線取 RSI 的 6 期簡單平均\ninput: _Len(14, \"RSI 期數\");\ninput: _AvgLen(6, \"平均線期數\");\ninput: _OverBought(70, \"超買線\");\ninput: _OverSold(30, \"超賣線\");\n\nvariable: _rsi(0), _rsiAvg(0);\n\n_rsi = RSI(Close, _Len);\n_rsiAvg = Average(_rsi, _AvgLen);\n\nPlot1(_rsi, \"RSI\");\nPlot2(_rsiAvg, \"RSI 平均\");\nPlot3(_OverBought, \"超買\");\nPlot4(_OverSold, \"超賣\");\n", "{@type:sensor}\n// 警示：5 分 K 收盤價向上突破布林通道上軌，且當根成交量大於 500 張\n// 採用：布林通道 20 期、2 倍標準差\n// 採用：「突破」解讀為由下往上穿越，站上之後的 K 棒不會重複觸發\ninput: _Len(20, \"布林通道期數\");\ninput: _Band(2, \"標準差倍數\");\ninput: _MinVol(500, \"成交量門檻(張)\");\n\nvariable: _upper(0);\n\n_upper = BollingerBand(Close, _Len, _Band);\n\nif Close Crosses Above _upper and Volume > _MinVol then ret = 1;\n", "{@type:autotrade}\n// 交易：台指期 5 分 K，KD 黃金交叉且 K 值小於 50 時做多 1 口\n// 出場：停損 2%、停利 4%（以成交均價為基準），收盤前 5 分鐘強制平倉\n// 採用：KD 參數 9／3／3（XQ 內建預設值）\ninput: _Len(9, \"KD 天數\");\ninput: _RSVt(3, \"RSVt 權數\");\ninput: _Kt(3, \"Kt 權數\");\ninput: _KLimit(50, \"K 值上限\");\ninput: _StopPct(2, \"停損(%)\");\ninput: _TakePct(4, \"停利(%)\");\ninput: _ExitMin(5, \"收盤前 N 分鐘平倉\");\n\nvariable: _rsv(0), _k(0), _d(0);\nvariable: _plPct(0);\nvariable: _closing(false);\n\nStochastic(_Len, _RSVt, _Kt, _rsv, _k, _d);\n_closing = EnterMarketCloseTime(_ExitMin);\n\n// 進場：空手、尚未進入收盤階段，KD 黃金交叉且 K 值低於門檻\nif Position = 0 and not _closing and _k Crosses Above _d and _k < _KLimit then\n    SetPosition(1, MARKET);\n\n// 停損停利：多單 1 口成交後，依成交均價計算損益百分比\nif Position = 1 and Filled = 1 then begin\n    _plPct = 100 * (Close - FilledAvgPrice) / FilledAvgPrice;\n    if _plPct <= -1 * _StopPct then SetPosition(0, MARKET);\n    if _plPct >= _TakePct then SetPosition(0, MARKET);\nend;\n\n// 收盤前平倉：當日部位一定歸零\nif Position <> 0 and _closing then SetPosition(0, MARKET);\n"];

function highlight(line){
  let html = esc(line);
  const holds = [];
  const hold = (cls, txt) => { holds.push('<span class="' + cls + '">' + txt + "</span>");
                               return String.fromCharCode(0xE000 + holds.length - 1); };
  html = html.replace(/\{@type:[^}]*\}/g, m => hold("meta", m));
  html = html.replace(/\{[^}]*\}/g, m => hold("cmt", m));
  html = html.replace(/\/\/.*$/g, m => hold("cmt", m));
  html = html.replace(/&quot;[^&]*?&quot;/g, m => hold("str", m));
  html = html.replace(RE_FN, m => '<span class="fn">' + m + "</span>");
  html = html.replace(RE_KW, m => '<span class="kw">' + m + "</span>");
  html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  holds.forEach((h, i) => { html = html.split(String.fromCharCode(0xE000 + i)).join(h); });
  return html;
}

      "<p>支援選股／指標／警示／交易四類腳本，全程由地端模型在本機運算。<br>點選任一策略，看 AI 如何把需求變成可編譯的程式碼。</p>" +
      '<div class="cards">' + STRATS.map((s, i) => cardHtml(s, "s" + i)).join("") + "</div>" +
      '<div class="sec"><h3>' + SHIELD + "防護機制展示</h3><span>不相干的問題與惡意指令，系統如何應對</span></div>" +
      '<div class="cards g3">' + GUARDS.map((g, i) => cardHtml(g, "g" + i)).join("") + "</div>" +
    "</div>";
}
function cardHtml(s, ref){
  return '<button class="card ' + s.cls + '" data-ref="' + ref + '">' +
    '<span class="ico">' + ICONS[s.key] + "</span>" +
    '<span class="txt"><span class="tags"><span class="tag">' + s.tag + "</span>" +
      (s.freq ? '<span class="tag freq">' + s.freq + "</span>" : "") + "</span>" +
    "<b>" + s.title + '</b><span class="d">' + s.desc + "</span></span>" +
    '<span class="go">' + ARROW + "</span></button>";
}
const byRef = ref => (ref[0] === "g" ? GUARDS : STRATS)[+ref.slice(1)];

function addMsg(who){
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.innerHTML = (who === "bot"
      ? '<div class="pic bot">' + SPARK + "</div>"
      : '<div class="pic me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.8 20.5c.9-4.1 4.2-6.6 8.2-6.6s7.3 2.5 8.2 6.6z"/></svg></div>') +
    '<div class="col"><div class="ts">' + (who === "bot" ? "XS 智慧引擎 · " : "") + now() + '</div><div class="bubble"></div></div>';
  thread.appendChild(el);
  return { el, bubble: el.querySelector(".bubble") };
}

function mountProgress(bubble, withSteps){
  bubble.innerHTML =
    '<div class="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
    '<span class="stage"></span></div><div class="detail"></div>' +
    (withSteps === false ? "" : '<ol class="steps">' + STEP_NAMES.map((n, i) =>
      '<li><span class="n">' + (i + 1) + "</span>" + n + "</li>").join("") + "</ol>");
  const stage = bubble.querySelector(".stage"), detail = bubble.querySelector(".detail");
  const items = bubble.querySelectorAll(".steps li");
  return {
    set(st, s){
      stage.textContent = st.label;
      detail.classList.remove("swap"); void detail.offsetWidth; detail.classList.add("swap");
      detail.textContent = st.detail(s);
      items.forEach((li, i) => {
        li.classList.toggle("done", i < st.step);
        li.classList.toggle("on", i === st.step);
        li.querySelector(".n").innerHTML = i < st.step ? CHECK : String(i + 1);
      });
    }
  };
}

function renderCode(bubble, s){
  const lines = s.code.replace(/\s+$/, "").split("\n");
  const per = Math.min(22, 900 / lines.length);   // 整段逐行浮現控制在 1 秒內
  bubble.classList.add("bare");
  bubble.innerHTML =
    '<div class="codewrap ' + s.cls + '">' +
      '<div class="code-head"><span class="lang">XS</span>' +
        '<span class="tbadge">' + s.type + "</span>" +
        '<span class="okbadge">' + CHECK + "語法檢查通過</span>" +
        '<span class="lines">' + lines.length + " 行</span>" +
        '<button class="copy" type="button">' + COPY_ICON + "<span>複製</span></button>" +
      "</div><pre><code>" +
      lines.map((l, i) => '<span class="ln" style="animation-delay:' + Math.round(i * per) + 'ms">' +
                          (highlight(l) || " ") + "</span>").join("") +
    "</code></pre></div>" +
    '<div class="generated-disclaimer">• <strong>' + esc(GENERATION_DISCLAIMER) + "</strong></div>" +
    afterChips(s);
  bubble.querySelector(".copy").addEventListener("click", e => copyCode(e.currentTarget, s.code));
}

function afterChips(current){
  const group = (label, list, pre) => {
    const items = list.map((s, i) => [s, pre + i]).filter(([s]) => s !== current);
    return '<div class="grp"><div class="lbl">' + label + '</div><div class="minis">' +
      items.map(([s, ref]) => '<button class="mini ' + s.cls + '" data-ref="' + ref + '"><i></i>' +
                              s.tag + "｜" + s.title + "</button>").join("") + "</div></div>";
  };
  return '<div class="after">' +
    group(STRATS.includes(current) ? "試試其他策略" : "可以體驗的策略", STRATS, "s") +
    group("防護機制展示", GUARDS, "g") + "</div>";
}
const demoNote = html => '<div class="demo-note"><span class="tagd">DEMO 解說</span>' + html + "</div>";

async function copyCode(btn, text){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0;";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch(_) {}
    ta.remove();
  }
  btn.classList.toggle("done", ok);
  btn.lastChild.textContent = ok ? "已複製" : "請手動選取";
  setTimeout(() => { btn.classList.remove("done"); btn.lastChild.textContent = "複製"; }, 1800);
}

const scrollDown = () => { scroller.scrollTop = scroller.scrollHeight; };
function setBusy(b){
  busy = b;
  document.body.classList.toggle("busy", b);
  input.disabled = b;
  sendBtn.disabled = b || !input.value.trim();
}
function autosize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  sendBtn.disabled = busy || !input.value.trim();
}

/* ── 主流程 ───────────────────────────────────────────── */
async function typeInto(text, my){
  const step = Math.max(1, Math.ceil(text.length / TYPE_FRAMES));
  for(let i = step; i <= text.length + step - 1; i += step){
    if(my !== runId) return false;
    input.value = text.slice(0, i); autosize();
    await sleep(16);
  }
  return my === runId;
}

async function run(s, typedText){
  if(busy) return;
  const my = ++runId;
  setBusy(true);
  const empty = thread.querySelector(".empty");
  if(empty) empty.remove();

  if(!typedText){ input.disabled = false; if(!(await typeInto(s.req, my))) return; }
  const userText = typedText || s.req;
  input.value = ""; autosize(); input.disabled = true;

  addMsg("user").bubble.textContent = userText;
  const bot = addMsg("bot");
  const prog = mountProgress(bot.bubble);
  scrollDown();

  for(const st of STAGES){
    prog.set(st, s);
    await sleep(st.ms);
    if(my !== runId) return;
  }
  renderCode(bot.bubble, s);
  setBusy(false);
  // 程式碼通常比畫面高：捲到這則回覆的開頭，而不是捲到底
  requestAnimationFrame(() => {
    scroller.scrollTop = bot.el.offsetTop - scroller.offsetTop - 16;
  });
}

/* 防護情境：與真實系統同樣不呼叫模型，所以只有一個短暫的檢查階段就回覆 */
async function runGuard(g, typedText){
  if(busy) return;
  const my = ++runId;
  setBusy(true);
  const empty = thread.querySelector(".empty");
  if(empty) empty.remove();

  if(!typedText){ input.disabled = false; if(!(await typeInto(g.req, my))) return; }
  const userText = typedText || g.req;
  input.value = ""; autosize(); input.disabled = true;

  const user = addMsg("user");
  user.bubble.textContent = userText;
  const bot = addMsg("bot");
  const prog = mountProgress(bot.bubble, false);
  const stage = g.kind === "inject" ? INJECT_STAGE : SCOPE_STAGE;
  prog.set(stage, g);
  scrollDown();
  await sleep(stage.ms);
  if(my !== runId) return;

  if(g.kind === "inject"){
    bot.bubble.classList.add("bare");
    bot.bubble.innerHTML = '<div class="notice err"><b>🛡️ 無法處理這則訊息</b><br>' + esc(BLOCK_MSG) + "</div>";
  } else {
    bot.bubble.textContent = OUT_OF_SCOPE_MSG;
  }
  bot.el.querySelector(".col").insertAdjacentHTML("beforeend", demoNote(g.note) + afterChips(g));
  setBusy(false);
  // 回覆很短：捲到使用者那則訊息，讓「輸入了什麼」和「系統怎麼回」同時在畫面上
  requestAnimationFrame(() => {
    scroller.scrollTop = user.el.offsetTop - scroller.offsetTop - 16;
  });
}

/* 自由輸入的判斷順序與後端相同：先過注入審查，再看是不是策略需求 */
function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  if(INJECT_RE.some(re => re.test(text))) return runGuard(GUARDS[2], text);
  const hit = MATCH_ORDER.map(i => STRATS[i]).find(s => s.match.test(text));
  if(hit) return run(hit, text);
  const known = GUARDS.find(g => g.kind === "scope" && g.req.replace(/？/g, "") === text.replace(/[?？]/g, ""));
  if(known) return runGuard(known, text);
  if(!DOMAIN_RE.test(text)) return runGuard(GENERIC_SCOPE, text);
  // 像是策略需求、但展示版沒有收錄：引導回四種預設策略
  const empty = thread.querySelector(".empty");
  if(empty) empty.remove();
  input.value = ""; autosize();
  addMsg("user").bubble.textContent = text;
  const bot = addMsg("bot");
  bot.bubble.textContent = "這個展示頁收錄了選股、指標、警示、交易四種策略，點選下方任一個即可體驗完整的生成流程。";
  bot.el.querySelector(".col").insertAdjacentHTML("beforeend", afterChips(null));
  scrollDown();
}

function reset(){
  runId++;
  setBusy(false);
  input.value = ""; autosize();
  renderEmpty();
  scroller.scrollTop = 0;
}

/* ── 事件 ─────────────────────────────────────────────── */
thread.addEventListener("click", e => {
  const b = e.target.closest(".card, .mini");
  if(!b) return;
  const item = byRef(b.dataset.ref);
  if(GUARDS.includes(item)) runGuard(item); else run(item);
});
sendBtn.addEventListener("click", send);
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$("newBtn").addEventListener("click", reset);
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("xsdemo-theme", root.dataset.theme); } catch(e) {}
});
try { const t = localStorage.getItem("xsdemo-theme"); if(t) document.documentElement.dataset.theme = t; } catch(e) {}

renderEmpty();
</script>
</body>
</html>
